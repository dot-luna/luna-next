screen.name = "default"

wallpaper {
  # Absolute local path; empty uses only background_color.
  source = ""
  # auto detects media while building; image and video explicitly select playback.
  type = "auto"
  fit = "fill"
  background_color = "#000000"
}

# Omitted colors and fonts inherit the selected Luna theme when building.
colors {}
fonts {}
