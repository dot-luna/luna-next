# Wallpaper configuration. Copy to ~/.config/luna-next/wallpaper.conf.
# Uses $XDG_CONFIG_HOME/luna-next/wallpaper.conf when XDG_CONFIG_HOME is nonempty.
# LUNA_WALLPAPER_CONFIG=/path/to/wallpaper.conf selects a different file.
# Read once at startup; restart the app after editing. Only the first monitor is used.
# Omitted settings use the defaults below; unknown settings are ignored.

wallpaper {
  # Absolute local image, animation, or video path. Empty uses only the background.
  # Media type is detected automatically. Paths do not expand ~ or variables.
  source = ""

  # fill (default): preserve aspect ratio and crop to cover the output.
  # fit: preserve aspect ratio and show the whole image, leaving space around it.
  # stretch: fill the output without preserving aspect ratio.
  # center: keep the original pixel size, centered; crop outside the output.
  # tile: repeat images at their original size; videos use center instead.
  fit = "fill"

  # Color behind the media and in uncovered areas; #RRGGBB format.
  background_color = "#000000"
}

playback {
  # true pauses animation/video on disabled or sleeping Hyprland outputs and
  # resumes when active. false keeps playing. Other compositors keep playing.
  pause_when_output_inactive = true
}

transition {
  # fade (default) or none. Applies to images at startup; videos appear immediately.
  type = "fade"

  # Integer milliseconds, 0..2147483647. Zero is immediate; ignored for none.
  duration_ms = 200
}
