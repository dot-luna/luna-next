[package]
name = "ln-cli"
version = "0.1.0"
edition = "2024"
description = "Luna commands for terminals and applications"
license = "MIT"

[[bin]]
name = "luna"
path = "src/main.rs"

[dependencies]
luna-next.workspace = true
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.23"
