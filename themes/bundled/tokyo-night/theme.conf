fonts {
  mono = "Iosevka Nerd Font"
  ui = "Outfit"
}
wallpaper {
  sources = []
}
appearance {
  gaps {
    inner = 5
    outer = 5
  }
  border_width = 1
  rounding = 0
  opacity {
    active = 0.9
    inactive = 0.85
    fullscreen = 1
  }
  blur {
    enabled = true
    passes = 3
    size = 10
  }
  shadow {
    enabled = true
    range = 12
    falloff = 3
  }
}
