# Packages installed using Git repository recipes.
[
    {
        name: "yay",
        source: "git",
        version: null,
        url: "https://aur.archlinux.org/yay.git",
        purpose: "Install and update AUR packages",
        command: [
            ["makepkg", "--syncdeps", "--install", "--rmdeps", "--clean", "--needed", "--noconfirm"]
        ]
    },
    {
        name: "t3code",
        source: "git",
        version: "latest",
        git_include_prereleases: true,
        git_release_tag_pattern: "v[0-9]*",
        url: "https://github.com/pingdotgg/t3code.git",
        purpose: "T3 Code desktop app, including nightly releases",
        command: [
            ["sh", "-c", "curl --fail --location --show-error --output .luna-next-t3code.AppImage \"https://github.com/pingdotgg/t3code/releases/download/${LUNA_PACKAGE_VERSION:?}/T3-Code-${LUNA_PACKAGE_VERSION#v}-x86_64.AppImage\""],
            ["sh", "-c", "install -Dm755 .luna-next-t3code.AppImage \"$HOME/.local/bin/t3code\""]
        ]
    }
]
