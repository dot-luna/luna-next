# Packages installed using Git repository recipes.
[
    {
        name: "yay",
        source: "git",
        version: null,
        url: "https://aur.archlinux.org/yay.git",
        purpose: "Install and update AUR packages",
        command: [
            ["makepkg", "--syncdeps", "--install", "--rmdeps", "--clean", "--needed", "--noconfirm"]
        ]
    },
    {
        name: "t3code",
        source: "git",
        version: "latest",
        git_include_prereleases: true,
        git_release_tag_pattern: "v[0-9]*",
        url: "https://github.com/pingdotgg/t3code.git",
        purpose: "T3 Code desktop app with Luna defaults, including nightly releases",
        command: [
            ["sh", "-c", "exec mise exec --yes node@lts pnpm@latest -- node \"$LUNA_NEXT_ROOT/apps/t3code/src/build.cjs\""]
        ]
    }
]
