[package]
name = "luna-next-hocon-qml"
version = "0.1.0"
edition = "2024"
description = "Read-only HOCON loader for the LunaNext.Config QML module"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = "1.0"
luna-next-hocon.workspace = true
serde_json = "1.0"

[build-dependencies]
cxx-build = "1.0"

[dev-dependencies]
tempfile = "3.23"
