# Generated from Luna Next's selected theme; run lnxt configure kitty to refresh.

# Use the theme's terminal font; Kitty resolves its styled faces automatically.
font_family {{fonts.mono}}
bold_font auto
italic_font auto
bold_italic_font auto

# Terminal text, cursor, and selected text.
background {{colors.background}}
foreground {{colors.foreground}}
cursor {{colors.accent}}
cursor_text_color {{colors.accent_foreground}}
selection_background {{colors.selection}}
selection_foreground {{colors.selection_foreground}}

# Window borders and tab labels share Luna's surface and accent colors.
active_border_color {{colors.accent}}
inactive_border_color {{colors.muted}}
bell_border_color {{colors.warning}}
active_tab_background {{colors.accent}}
active_tab_foreground {{colors.accent_foreground}}
inactive_tab_background {{colors.lighter_background}}
inactive_tab_foreground {{colors.foreground}}
tab_bar_background {{colors.dark_background}}

# ANSI colors 0-7, followed by their emphasized variants 8-15.
color0 {{colors.dark_background}}
color1 {{colors.error}}
color2 {{colors.success}}
color3 {{colors.warning}}
color4 {{colors.link}}
color5 {{colors.secondary_accent}}
color6 {{colors.info}}
color7 {{colors.light_foreground}}
color8 {{colors.dark_foreground}}
color9 {{colors.error_emphasis}}
color10 {{colors.success_emphasis}}
color11 {{colors.warning_emphasis}}
color12 {{colors.link_emphasis}}
color13 {{colors.secondary_accent_emphasis}}
color14 {{colors.info_emphasis}}
color15 {{colors.bright_foreground}}
