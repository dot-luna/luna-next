# lnxt configure kitty generates colors and fonts from the selected theme.
include ./generated/theme.conf

# Font sizes are in points; keep ligatures enabled.
disable_ligatures never
font_size 14

# Keep the underline cursor steady, including at the shell prompt.
cursor_shape underline
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no

# Let Hyprland place new windows without restoring Kitty's cached maximized state.
remember_window_size no

# Let desktop actions query the focused pane through a local per-process socket.
# Terminal-output control requests stay disabled; restart Kitty after changing this.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/luna-kitty-{kitty_pid}

# Padding is in points, ordered top, right, bottom, left.
window_padding_width 5 5 1 5
hide_window_decorations yes
confirm_os_window_close 0
