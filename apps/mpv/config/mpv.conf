# Start videos in fullscreen; audio files use the same playback preferences.
fullscreen=yes

# Prefer GPU decoding when supported, with software decoding as the fallback.
hwdec=auto-safe

# Start new files at 2x. Bracket keys adjust speed in 0.25x steps during playback.
speed=2

# Resume the same file after a normal quit or window close. mpv also remembers
# adjusted speed and volume in its native resume data, without an expiry timer.
save-position-on-quit=yes

# The OSC is the control bar that appears when you move the mouse.
osc=no

# Keep status text at 24 pixels instead of enlarging it with fullscreen video.
osd-scale-by-window=no
osd-font-size=24

# Seek and volume indicators use percentages of the window: half its width,
# 1% of its height, and near the bottom (-1 is top, 0 center, 1 bottom).
osd-bar-w=50
osd-bar-h=1
osd-bar-align-y=0.80
