# Up/Down: change volume by five percentage points.
UP add volume 5
DOWN add volume -5

# Left/right bracket: change speed by 0.25x instead of mpv's default 10% steps.
[ add speed -0.25
] add speed 0.25

# Super+W: close normally if the compositor forwards this shortcut to mpv.
# mpv calls the Super modifier Meta; normal quit also saves playback position.
Meta+w quit
