# Follow the terminal palette and background, including transparency.
color_theme = "TTY"
theme_background = false
force_tty = false

# Keep modern terminal graphics while reducing redraw flicker.
graph_symbol = "braille"
terminal_sync = true

vim_keys = true
shown_boxes = "cpu mem net proc"

# Use steady sampling and CPU sorting that is easier to follow.
update_ms = 2000
proc_sorting = "cpu lazy"

# Keep preferences changed in btop's UI when exiting normally.
save_config_on_exit = true
