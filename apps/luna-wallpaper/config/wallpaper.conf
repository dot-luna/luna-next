# Default wallpaper settings. Copy to ~/.config/luna-next/wallpaper.conf.
# Set wallpaper.source to an absolute media path; restart the app after editing.

wallpaper {
  # Empty shows only the background color.
  source = ""
  # fill, fit, stretch, center, or tile; videos use center for tile.
  fit = "fill"
  # Color behind the media, in #RRGGBB format.
  background_color = "#000000"
}

playback {
  # Pause moving media on disabled or sleeping Hyprland outputs.
  pause_when_output_inactive = true
}

transition {
  # fade or none; images fade at startup, videos appear immediately.
  type = "fade"
  # Milliseconds, 0..2147483647; zero switches immediately.
  duration_ms = 200
}
